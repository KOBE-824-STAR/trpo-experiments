env:
  name: Breakout-v5
  num_training_envs: 8
  num_testing_envs: 8
algorithm:
  name: DQN
  buffer_name: ReplayBuffer
  buffer_size: 1000000
  learning_rate: 0.0001
  gamma: 0.99
  optimizer: Adam
  start_epsilon: 1
  end_epsilon: 0.1
  epsilon_schedular: linear
  use_target: true
  target_update_method: soft
  target_update_interval: 1000
  target_update_tau: 0.05
use_wandb: true
use_tensorboard: true`
save_interval: 50000
reward_buffer_size: 20
experiment_name: ${env.name}-${algorithm.name}
hydra_base_dir: ''
